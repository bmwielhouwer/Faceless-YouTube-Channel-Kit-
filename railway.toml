# Railway config-as-code. Railway auto-detects the Dockerfile; this pins the
# run command and restart behavior for the always-on worker.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python run.py"
# NOTE: deliberately NO healthcheckPath. The worker keeps a TCP listener open on
# $PORT (see run.py), which is enough for Railway to consider it healthy. An HTTP
# healthcheck would probe "/" on a schedule and, during a 10+ minute CPU-bound
# render, slow/missed responses made Railway restart the container mid-render and
# abandon the video. Without the HTTP healthcheck, long renders are not killed.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
